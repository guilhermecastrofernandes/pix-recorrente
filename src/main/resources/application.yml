spring:
  application:
    name: pix-recorrente-api
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

antifraude:
  limite-valor-suspeito: 5000.00
  limite-noturno: 1000.00
  chaves-blacklist:
    - fraudulento@banco.com.br
    - suspeito@empresa.com.br
    - "11999999999"

scheduler:
  pagamento:
    delay: 60000
    initial-delay: 5000
  dlq-scanner:
    delay: 60000
    initial-delay: 10000

pix:
  simulacao:
    taxa-falha: 0.0      # 0.0 a 1.0 - probabilidade de falha na liquidacao simulada
    latencia-ms: 100

server:
  port: 8080
