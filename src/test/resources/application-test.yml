spring:
  application:
    name: pix-recorrente-api-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false   # testes nao dependem de broker; o publisher e mockado

server:
  port: 0

scheduler:
  pagamento:
    delay: 3600000
    initial-delay: 3600000    # scheduler nao dispara durante os testes

pix:
  simulacao:
    taxa-falha: 0.0
    latencia-ms: 0

antifraude:
  limite-valor-suspeito: 5000.00
  limite-noturno: 1000.00
  chaves-blacklist:
    - fraudulento@banco.com.br
    - suspeito@empresa.com.br
    - "11999999999"
